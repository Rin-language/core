name: CI

# A branch is checked when its pull request is open; main is checked on every push.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no secret used anywhere: a pull request from a fork runs the
# same jobs with nothing worth stealing. Never switch the trigger to
# pull_request_target.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the route drift test and the check that every config key is documented.
      - run: pnpm test
      - run: pnpm --filter @rin-language/core-server build
      - run: pnpm --filter @rin-language/core-web build

  # The tests run in a network namespace with only loopback, after a probe has
  # shown the network is cut: no test can reach a real model.
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/run-tests-offline.sh pnpm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Blocking: a high or critical advisory fails the job, dev dependencies included.
      - run: pnpm audit --audit-level=high

  local-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node scripts/check-no-local-deps.mjs

  # A released migration is never edited: databases already ran it.
  migrations-unchanged:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Through the environment: a branch name is attacker-controlled text.
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migrations-unchanged.mjs "origin/$BASE_REF"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      # --redact keeps a leaked value out of the job log.
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag rin-core:ci .
      # Blocking on fixable high or critical findings in the image that ships.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rin-core:ci
          # The scanner itself, pinned like the action. Never v0.69.4: that release
          # was compromised in a supply chain attack. Move to a later release only
          # after checking the project's advisories.
          version: v0.69.3
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start with docker compose and wait for the health check
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Ask /health
        run: curl --fail --silent --show-error http://127.0.0.1:3000/health
      - name: Show the logs when it failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
