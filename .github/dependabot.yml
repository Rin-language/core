version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release so a hijacked or yanked version is usually caught first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Major bumps are not grouped: each one gets its own PR to review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Node stays on the 24 LTS line until we migrate on purpose (its support
    # ends 2028-04-30). Patch and minor updates still come; 25 and 26 do not.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
