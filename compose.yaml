services:
  app:
    build: .
    image: rin-core:local
    restart: unless-stopped
    ports:
      # Loopback only. Put a reverse proxy with TLS in front to expose it.
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    volumes:
      - rin-data:/var/lib/rin
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(Number(!r.ok))).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  rin-data:
